name: Build OpenWrt Package (ipq50xx)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 rsync unzip wget zlib1g-dev xz-utils zstd

      - name: 提取插件名
        id: extract
        run: |
          PLUGIN_NAME=$(grep '^PKG_NAME:=' Makefile | awk '{print $2}')
          echo "PLUGIN_NAME=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          echo "插件名: $PLUGIN_NAME"

      - name: 下载 OpenWrt SDK (ipq50xx)
        run: |
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq50xx/openwrt-sdk-qualcommax-ipq50xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget "$SDK_URL" -O sdk-archive
          tar -I zstd -xf sdk-archive
          SDK_DIR=$(tar -tf sdk-archive | head -1 | cut -f1 -d'/')
          mv "$SDK_DIR" openwrt-sdk

      - name: 复制插件到 SDK
        run: |
          mkdir -p openwrt-sdk/package/${{ steps.extract.outputs.PLUGIN_NAME }}
          rsync -av --delete \
            --exclude 'openwrt-sdk' \
            --exclude '.git' \
            --exclude 'bin' \
            --exclude '.github/workflows' \
            --exclude '*.tar.*' \
            --exclude 'sdk-archive' \
            ./ openwrt-sdk/package/${{ steps.extract.outputs.PLUGIN_NAME }}/

      - name: 安装 feeds 并配置
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_${{ steps.extract.outputs.PLUGIN_NAME }}=m" >> .config
          make defconfig

      - name: 编译插件
        run: |
          cd openwrt-sdk
          make package/${{ steps.extract.outputs.PLUGIN_NAME }}/compile -j$(nproc) V=s || true

      - name: 收集产物
        run: |
          mkdir -p output
          find openwrt-sdk/bin/packages -type f \( \
              -name "${{ steps.extract.outputs.PLUGIN_NAME }}*.ipk" \
          \) -exec cp {} output/ \;
          ls -la output/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.extract.outputs.PLUGIN_NAME }}-ipq50xx
          path: output/
          retention-days: 30
          if-no-files-found: warn
